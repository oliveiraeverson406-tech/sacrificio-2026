<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacrifício 2026 — Escada de Entrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#12182b;
    --navy-900:#1a2140;
    --navy-800:#232c52;
    --navy-700:#303a63;
    --gold-500:#d4a72c;
    --gold-400:#e6c157;
    --gold-100:#f6ecc9;
    --cream:#f4efe3;
    --cream-dim:#c7c9d8;
    --terracotta:#b5563a;
    --green:#4d8f6d;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--navy-950);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(212,167,44,0.08), transparent 45%),
      radial-gradient(circle at 100% 30%, rgba(212,167,44,0.05), transparent 40%);
    color:var(--cream);
    font-family:'Inter',system-ui,sans-serif;
    padding:0 0 60px;
    min-height:100vh;
  }
  header{
    padding:36px 20px 28px;
    text-align:center;
    border-bottom:1px solid var(--navy-700);
  }
  .stairs-icon{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:5px;
    height:30px;
    margin-bottom:14px;
  }
  .stairs-icon span{
    width:12px;
    background:linear-gradient(180deg,var(--gold-400),var(--gold-500));
    border-radius:2px 2px 0 0;
  }
  .stairs-icon span:nth-child(1){height:12px;}
  .stairs-icon span:nth-child(2){height:20px;}
  .stairs-icon span:nth-child(3){height:30px;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:2.1rem;
    letter-spacing:0.02em;
    margin:0 0 6px;
    color:var(--gold-100);
  }
  header p{
    margin:0;
    color:var(--cream-dim);
    font-size:0.95rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
  }

  main{max-width:760px;margin:0 auto;padding:0 16px;}

  .summary-card{
    background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
    border:1px solid var(--navy-700);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-top:26px;
    text-align:center;
  }
  .summary-card .label{
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--cream-dim);
    margin-bottom:4px;
  }
  .summary-card .big{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:1.9rem;
    color:var(--gold-100);
    line-height:1.2;
  }
  .summary-card .big small{
    font-size:1rem;
    font-weight:500;
    color:var(--cream-dim);
  }
  .summary-bar{
    height:10px;
    background:var(--navy-950);
    border-radius:6px;
    overflow:hidden;
    margin:12px 0 8px;
  }
  .summary-bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold-500),var(--gold-400));
    transition:width 0.4s ease;
  }
  .summary-extra{
    font-size:0.8rem;
    color:var(--cream-dim);
  }
  .summary-extra b{color:var(--gold-400);}

  .progress{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:20px 0 28px;
    align-items:end;
  }
  .step-card{
    background:var(--navy-900);
    border:1px solid var(--navy-700);
    border-radius:var(--radius);
    padding:14px 10px 16px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .step-card .month-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:0.95rem;
    color:var(--gold-100);
    display:block;
    margin-bottom:10px;
  }
  .step-track{
    height:54px;
    background:var(--navy-800);
    border-radius:8px;
    position:relative;
    overflow:hidden;
    margin-bottom:8px;
  }
  .step-fill{
    position:absolute;
    bottom:0;left:0;right:0;
    background:linear-gradient(180deg,var(--gold-400),var(--gold-500));
    transition:height 0.4s ease;
  }
  .step-count{
    font-size:0.82rem;
    color:var(--cream-dim);
  }
  .step-count b{color:var(--gold-100);}
  .step-money{
    font-size:0.78rem;
    color:var(--cream-dim);
    margin-top:2px;
  }
  .step-meta{
    font-size:0.7rem;
    color:#8189a3;
    margin-top:1px;
  }

  .closing{
    background:var(--navy-900);
    border:1px solid var(--navy-700);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:26px;
  }
  .closing h3{
    font-family:'Fraunces',serif;
    font-size:1rem;
    color:var(--gold-100);
    margin:0 0 12px;
    font-weight:600;
  }
  .closing table{
    width:100%;
    border-collapse:collapse;
    font-size:0.85rem;
  }
  .closing td{
    padding:7px 4px;
    border-bottom:1px solid var(--navy-700);
    color:var(--cream-dim);
  }
  .closing td:first-child{color:var(--cream);font-weight:500;}
  .closing td:last-child{text-align:right;color:var(--gold-400);font-weight:600;}
  .closing tr.total td{
    border-bottom:none;
    padding-top:10px;
    color:var(--gold-100);
    font-weight:700;
    font-size:0.95rem;
  }
  .closing tr.total td:last-child{color:var(--gold-100);}

  .add-form{
    background:var(--navy-900);
    border:1px solid var(--navy-700);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:22px;
  }
  .add-form h2{
    font-family:'Fraunces',serif;
    font-size:1.05rem;
    margin:0 0 12px;
    color:var(--gold-100);
    font-weight:600;
  }
  .add-form .row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .add-form input{
    flex:1;
    min-width:140px;
    background:var(--navy-800);
    border:1px solid var(--navy-700);
    color:var(--cream);
    padding:10px 12px;
    border-radius:8px;
    font-size:0.95rem;
    font-family:inherit;
  }
  .add-form input::placeholder{color:#8189a3;}
  .add-form button{
    background:var(--gold-500);
    color:var(--navy-950);
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-form button:active{background:var(--gold-400);}

  .list-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .list-header h2{
    font-family:'Fraunces',serif;
    font-size:1.1rem;
    color:var(--gold-100);
    margin:0;
    font-weight:600;
  }
  .list-header span{font-size:0.82rem;color:var(--cream-dim);}

  .contributor{
    background:var(--navy-900);
    border:1px solid var(--navy-700);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .contributor.editing{
    flex-wrap:wrap;
    align-items:stretch;
  }
  .edit-fields{
    flex:1 1 100%;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .edit-fields input{
    background:var(--navy-800);
    border:1px solid var(--gold-500);
    color:var(--cream);
    padding:8px 10px;
    border-radius:7px;
    font-size:0.9rem;
    font-family:inherit;
    width:100%;
  }
  .edit-actions{
    flex:1 1 100%;
    display:flex;
    gap:8px;
    justify-content:flex-end;
  }
  .edit-actions button{
    border:none;
    padding:7px 14px;
    border-radius:7px;
    font-weight:600;
    font-size:0.82rem;
    cursor:pointer;
  }
  .btn-save{background:var(--gold-500);color:var(--navy-950);}
  .btn-cancel{background:var(--navy-700);color:var(--cream);}
  .btn-del-confirm{background:var(--terracotta);color:var(--cream);}
  .num{
    font-family:'Fraunces',serif;
    font-weight:600;
    color:var(--gold-500);
    font-size:0.9rem;
    min-width:22px;
  }
  .name-block{flex:1;min-width:0;}
  .name-block .nm{
    font-size:0.98rem;
    font-weight:500;
    color:var(--cream);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .name-block .note{
    font-size:0.74rem;
    color:var(--gold-400);
    margin-top:1px;
  }
  .squares{display:flex;gap:6px;}
  .sq{
    width:32px;height:32px;
    border-radius:7px;
    border:1.5px solid var(--navy-700);
    background:var(--navy-800);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
    color:transparent;
    cursor:pointer;
    font-size:1rem;
    flex-shrink:0;
  }
  .sq.paid{
    background:var(--gold-500);
    border-color:var(--gold-500);
    color:var(--navy-950);
  }
  .row-actions{display:flex;gap:4px;margin-left:2px;}
  .row-actions button{
    background:none;
    border:none;
    color:var(--cream-dim);
    font-size:1rem;
    cursor:pointer;
    padding:4px;
  }
  .row-actions button:hover{color:var(--terracotta);}

  .empty{
    text-align:center;
    color:var(--cream-dim);
    padding:30px 10px;
    font-size:0.9rem;
  }

  .toolbar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:24px 0 4px;
  }
  .toolbar button{
    background:var(--navy-900);
    border:1px solid var(--navy-700);
    color:var(--cream-dim);
    padding:8px 14px;
    border-radius:8px;
    font-size:0.82rem;
    cursor:pointer;
  }
  #fileInput{display:none;}

  @media (max-width:420px){
    .sq{width:28px;height:28px;}
    h1{font-size:1.7rem;}
  }
</style>
</head>
<body>

<header>
  <div class="stairs-icon"><span></span><span></span><span></span></div>
  <h1>Sacrifício 2026</h1>
  <p>Em prol da escada de entrada</p>
</header>

<main>
  <div class="summary-card" id="summaryCard"></div>
  <div class="progress" id="progress"></div>
  <div class="closing" id="closing"></div>

  <div class="add-form">
    <h2>Adicionar contribuinte</h2>
    <div class="row">
      <input type="text" id="newName" placeholder="Nome completo">
      <input type="text" id="newNote" placeholder="Observação (ex: 3 sacas de cimento)">
      <button onclick="addContributor()">Adicionar</button>
    </div>
  </div>

  <div class="list-header">
    <h2>Contribuintes</h2>
    <span id="totalCount">0 pessoas</span>
  </div>

  <div id="list"></div>

  <div class="toolbar">
    <button onclick="exportData()">Exportar backup</button>
    <button onclick="document.getElementById('fileInput').click()">Importar backup</button>
  </div>
  <input type="file" id="fileInput" accept="application/json" onchange="importData(event)">
</main>

<script>
const STORAGE_KEY = 'sacrificio2026';
const MONTHS = ['junho','julho','agosto'];
const MONTH_LABELS = {junho:'JUNHO', julho:'JULHO', agosto:'AGOSTO'};
const VALOR_MES = 50;

const NOMES_INICIAIS = [
  {name:'Alfredo de Souza'},
  {name:'Benedito Gama'},
  {name:'Cléo Nogueira'},
  {name:'Celma Dutra'},
  {name:'Daniele Ferreira'},
  {name:'Dariane Carneiro'},
  {name:'Everson Oliveira'},
  {name:'Elzer Gama'},
  {name:'Gemima Dutra'},
  {name:'Ianezza Oliveira'},
  {name:'Jander Salgado'},
  {name:'Jorgiana Gomes'},
  {name:'Jairo Gomes', note:'3 sacas de cimento'},
  {name:'Joana Souza'},
  {name:'Juracy Rodrigues'},
  {name:'José Neto Brandão'},
  {name:'Jorge Carvalho'},
  {name:'Jonas de Araujo Silva'},
  {name:'Kethlen dos Santos'},
  {name:'Lurdeth Prisco'},
  {name:'Laís Souza Pereira'},
  {name:'Maria do Socorro'},
  {name:'Pastor João Mesquita'},
  {name:'Pastora Silvia'},
  {name:'Poliana', note:'3 sacas de cimento'},
  {name:'Perpétua Pereira'},
  {name:'Raifran Viana'},
  {name:'Sandra Regina'},
  {name:'Tailana Dutra'},
  {name:'Viviane Viana'},
  {name:'Zebedeu Pereira'},
  {name:'Edina dos Reis'},
  {name:'Amanda de Souza'},
  {name:'Mario Pinheiro'},
  {name:'Lucas Gomes'},
  {name:'Dorvalina Gomes'},
  {name:'Nome 37', note:'confirmar nome'},
  {name:'Nome 38', note:'confirmar nome'}
];

let data = load();
sortData();

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) return parsed;
    }
  }catch(e){
    // armazenamento bloqueado neste navegador — segue com a lista inicial
  }
  return NOMES_INICIAIS.map((p,i) => ({
    id: 'seed'+i,
    name: p.name,
    note: p.note || '',
    junho:false, julho:false, agosto:false
  }));
}

function sortData(){
  data.sort((a, b) => a.name.localeCompare(b.name, 'pt', {sensitivity:'base'}));
}

function save(){
  sortData();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    setStorageWarning(false);
  }catch(e){
    setStorageWarning(true);
  }
  render();
}

function setStorageWarning(broken){
  let warn = document.getElementById('storageWarning');
  if(broken){
    if(!warn){
      warn = document.createElement('div');
      warn.id = 'storageWarning';
      warn.style.cssText = 'background:#b5563a;color:#f4efe3;padding:10px 16px;text-align:center;font-size:0.82rem;';
      warn.textContent = 'Este navegador está bloqueando o salvamento automático. As alterações funcionam, mas não ficam salvas ao fechar — abra este arquivo direto no Chrome para salvar de verdade.';
      document.body.insertBefore(warn, document.body.firstChild);
    }
  }else if(warn){
    warn.remove();
  }
}

function addContributor(){
  const nameInput = document.getElementById('newName');
  const noteInput = document.getElementById('newNote');
  const name = nameInput.value.trim();
  if(!name) return;
  data.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name: name,
    note: noteInput.value.trim(),
    junho:false, julho:false, agosto:false
  });
  nameInput.value = '';
  noteInput.value = '';
  save();
  nameInput.focus();
}

function toggleMonth(id, month){
  const c = data.find(x => x.id === id);
  if(c){ c[month] = !c[month]; save(); }
}

let editingId = null;
let pendingDeleteId = null;

function editName(id){
  editingId = id;
  pendingDeleteId = null;
  render();
  setTimeout(() => {
    const input = document.getElementById('editNameInput');
    if(input) input.focus();
  }, 0);
}

function saveEdit(id){
  const c = data.find(x => x.id === id);
  if(!c) return;
  const nome = document.getElementById('editNameInput').value.trim();
  const nota = document.getElementById('editNoteInput').value.trim();
  if(!nome) return;
  c.name = nome;
  c.note = nota;
  editingId = null;
  save();
}

function cancelEdit(){
  editingId = null;
  render();
}

function askRemove(id){
  pendingDeleteId = id;
  editingId = null;
  render();
}

function confirmRemove(id){
  data = data.filter(x => x.id !== id);
  pendingDeleteId = null;
  save();
}

function cancelRemove(){
  pendingDeleteId = null;
  render();
}

function metaDoMes(){
  return data.filter(c => !c.note).length * VALOR_MES;
}

function arrecadadoDoMes(m){
  let valor = 0, especiais = 0;
  data.forEach(c => {
    if(c[m]){
      if(c.note) especiais++;
      else valor += VALOR_MES;
    }
  });
  return {valor, especiais};
}

function renderProgress(){
  const el = document.getElementById('progress');
  const total = data.length || 1;
  const meta = metaDoMes();
  el.innerHTML = MONTHS.map(m => {
    const paidCount = data.filter(c => c[m]).length;
    const {valor, especiais} = arrecadadoDoMes(m);
    const pct = Math.round((paidCount/total)*100);
    return `
      <div class="step-card">
        <span class="month-name">${MONTH_LABELS[m]}</span>
        <div class="step-track">
          <div class="step-fill" style="height:${data.length ? pct : 0}%"></div>
        </div>
        <div class="step-count"><b>${paidCount}</b>/${data.length}</div>
        <div class="step-money">R$ ${valor.toLocaleString('pt-BR')}${especiais? ' + '+especiais+' esp.' : ''}</div>
        <div class="step-meta">meta: R$ ${meta.toLocaleString('pt-BR')}</div>
      </div>
    `;
  }).join('');
}

function renderClosing(){
  const el = document.getElementById('closing');
  const meta = metaDoMes();
  let totalGeral = 0;
  let especiaisGeral = 0;
  const linhas = MONTHS.map(m => {
    const {valor, especiais} = arrecadadoDoMes(m);
    totalGeral += valor;
    especiaisGeral += especiais;
    return `<tr><td>${MONTH_LABELS[m]}</td><td>R$ ${valor.toLocaleString('pt-BR')}${especiais? ' +'+especiais+' esp.' : ''} <span style="color:#8189a3">(meta R$ ${meta.toLocaleString('pt-BR')})</span></td></tr>`;
  }).join('');
  el.innerHTML = `
    <h3>Contabilidade dos 3 meses</h3>
    <table>
      ${linhas}
      <tr class="total"><td>Total geral</td><td>R$ ${totalGeral.toLocaleString('pt-BR')}${especiaisGeral? ' + '+especiaisGeral+' esp.' : ''}</td></tr>
    </table>
  `;
}

function renderList(){
  const el = document.getElementById('list');
  document.getElementById('totalCount').textContent = data.length + (data.length===1?' pessoa':' pessoas');
  if(data.length === 0){
    el.innerHTML = '<div class="empty">Nenhum contribuinte cadastrado ainda.<br>Adicione o primeiro nome acima.</div>';
    return;
  }
  el.innerHTML = data.map((c, i) => {
    if(c.id === editingId){
      return `
        <div class="contributor editing">
          <span class="num">${String(i+1).padStart(2,'0')}</span>
          <div class="edit-fields">
            <input type="text" id="editNameInput" value="${escapeAttr(c.name)}" placeholder="Nome completo">
            <input type="text" id="editNoteInput" value="${escapeAttr(c.note||'')}" placeholder="Observação (opcional)">
          </div>
          <div class="edit-actions">
            <button class="btn-cancel" onclick="cancelEdit()">Cancelar</button>
            <button class="btn-save" onclick="saveEdit('${c.id}')">Salvar</button>
          </div>
        </div>
      `;
    }
    if(c.id === pendingDeleteId){
      return `
        <div class="contributor editing">
          <span class="num">${String(i+1).padStart(2,'0')}</span>
          <div class="name-block"><div class="nm">Remover ${escapeHtml(c.name)}?</div></div>
          <div class="edit-actions">
            <button class="btn-cancel" onclick="cancelRemove()">Cancelar</button>
            <button class="btn-del-confirm" onclick="confirmRemove('${c.id}')">Remover</button>
          </div>
        </div>
      `;
    }
    return `
      <div class="contributor">
        <span class="num">${String(i+1).padStart(2,'0')}</span>
        <div class="name-block">
          <div class="nm">${escapeHtml(c.name)}</div>
          ${c.note ? `<div class="note">${escapeHtml(c.note)}</div>` : ''}
        </div>
        <div class="squares">
          ${MONTHS.map(m => `<div class="sq ${c[m]?'paid':''}" onclick="toggleMonth('${c.id}','${m}')">${c[m]?'✕':''}</div>`).join('')}
        </div>
        <div class="row-actions">
          <button onclick="editName('${c.id}')" title="Editar">✎</button>
          <button onclick="askRemove('${c.id}')" title="Remover">🗑</button>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function escapeAttr(str){
  return escapeHtml(str).replace(/"/g, '&quot;');
}

function renderSummary(){
  const el = document.getElementById('summaryCard');
  const pessoasSemNota = data.filter(c => !c.note).length;
  const metaTotal = pessoasSemNota * VALOR_MES * MONTHS.length;
  let arrecadado = 0;
  let quadrosEspeciaisPagos = 0;
  data.forEach(c => {
    MONTHS.forEach(m => {
      if(c[m]){
        if(c.note) quadrosEspeciaisPagos++;
        else arrecadado += VALOR_MES;
      }
    });
  });
  const pct = metaTotal ? Math.min(100, Math.round((arrecadado/metaTotal)*100)) : 0;
  const faltam = Math.max(0, metaTotal - arrecadado);
  el.innerHTML = `
    <div class="label">Total arrecadado (Sacrifício 2026)</div>
    <div class="big">R$ ${arrecadado.toLocaleString('pt-BR')} <small>de R$ ${metaTotal.toLocaleString('pt-BR')}</small></div>
    <div class="summary-bar"><div class="summary-bar-fill" style="width:${pct}%"></div></div>
    <div class="summary-extra">Faltam <b>R$ ${faltam.toLocaleString('pt-BR')}</b> para a meta${quadrosEspeciaisPagos ? ` · +${quadrosEspeciaisPagos} contribuições em material` : ''}</div>
  `;
}

function render(){
  renderSummary();
  renderProgress();
  renderClosing();
  renderList();
}

function exportData(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sacrificio-2026-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const imported = JSON.parse(e.target.result);
      if(Array.isArray(imported)){
        data = imported;
        save();
      }
    }catch(err){
      // arquivo inválido, ignora silenciosamente
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

render();
</script>
</body>
</html>
