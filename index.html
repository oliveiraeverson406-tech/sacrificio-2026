<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sacrifício 2026</title>
<meta name="theme-color" content="#3A3226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sacrifício">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stone-dark:#3A3226;
    --stone-ink:#2A241A;
    --parchment:#EFEADC;
    --parchment-2:#E4DCC6;
    --gold:#C08A28;
    --gold-light:#D6A54F;
    --moss:#4A5D45;
    --terra:#A8503A;
    --line:#D8CFB6;
    --shadow: 0 2px 8px rgba(42,36,26,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--parchment);
    color:var(--stone-ink);
    font-family:'Inter',sans-serif;
    padding-bottom:48px;
    min-height:100vh;
  }
  h1,h2,.num{font-family:'Fraunces',serif;}

  header{
    background:var(--stone-dark);
    color:var(--parchment);
    padding:28px 20px 22px;
    border-bottom:4px solid var(--gold);
  }
  header .eyebrow{
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--gold-light); font-weight:600; margin-bottom:4px;
  }
  header h1{font-size:26px; font-weight:700; margin:0 0 2px; line-height:1.15;}
  header p{margin:0; font-size:13.5px; color:#C9C0A9;}

  /* Staircase signature element */
  .stairs{
    display:flex; align-items:flex-end; gap:8px;
    padding:22px 20px 6px;
    background:var(--stone-dark);
  }
  .step{
    flex:1;
    background:rgba(255,255,255,0.06);
    border-radius:6px 6px 0 0;
    position:relative;
    overflow:hidden;
    display:flex; flex-direction:column; justify-content:flex-end;
    border:1px solid rgba(255,255,255,0.08);
  }
  .step:nth-child(1){height:64px;}
  .step:nth-child(2){height:92px;}
  .step:nth-child(3){height:120px;}
  .step .fill{
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    width:100%;
    transition:height .5s ease;
  }
  .step .label{
    position:absolute; top:6px; left:0; right:0; text-align:center;
    font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    color:#EFEADC;
  }
  .step .pct{
    position:absolute; bottom:6px; left:0; right:0; text-align:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:15px; color:#2A241A;
    text-shadow:0 1px 0 rgba(255,255,255,0.25);
  }
  .step.done{box-shadow:0 0 0 2px var(--gold-light) inset;}

  .summary{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    padding:16px 20px 4px;
  }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; box-shadow:var(--shadow);
  }
  .card .label{font-size:11.5px; color:#6B6250; text-transform:uppercase; letter-spacing:.05em; font-weight:600;}
  .card .value{font-family:'Fraunces',serif; font-size:21px; font-weight:700; margin-top:2px; color:var(--stone-ink);}
  .card.total{grid-column:1 / -1; background:var(--moss); border:none;}
  .card.total .label{color:#CFE0CB;}
  .card.total .value{color:#fff;}

  section.list-wrap{padding:18px 20px 0;}
  .list-head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;
  }
  .list-head h2{font-size:16px; margin:0; font-weight:600;}
  .list-head span{font-size:12.5px; color:#7A7159;}

  .add-row{
    display:flex; gap:8px; margin-bottom:14px;
  }
  .add-row input{
    flex:1; padding:11px 12px; border-radius:8px; border:1px solid var(--line);
    font-size:15px; font-family:'Inter',sans-serif; background:#fff;
  }
  .add-row input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .add-row button{
    background:var(--moss); color:#fff; border:none; border-radius:8px;
    padding:0 18px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .add-row button:active{transform:scale(.97);}

  .col-heads{
    display:grid; grid-template-columns:1fr 34px 34px 34px 26px 26px;
    gap:6px; padding:0 4px 6px; font-size:11px; color:#8A8066;
    text-transform:uppercase; letter-spacing:.04em; font-weight:600; text-align:center;
  }
  .col-heads span:first-child{text-align:left;}

  ul.contrib-list{list-style:none; margin:0; padding:0;}
  .contrib-list li{
    display:grid; grid-template-columns:1fr 34px 34px 34px 26px 26px;
    align-items:center; gap:6px;
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:9px 6px 9px 12px; margin-bottom:7px;
  }
  .contrib-list .name{
    font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .chk{
    width:30px; height:30px; border-radius:6px; border:1.5px solid var(--line);
    background:#F7F4EA; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:15px; color:transparent; margin:0 auto;
  }
  .chk.checked{
    background:var(--gold); border-color:var(--gold); color:#fff; font-weight:700;
  }
  .del-btn, .edit-btn{
    width:26px; height:26px; border-radius:50%; border:none; background:transparent;
    font-size:14px; cursor:pointer; margin:0 auto; display:flex; align-items:center; justify-content:center;
  }
  .del-btn{color:var(--terra);}
  .edit-btn{color:var(--moss);}

  .empty{
    text-align:center; padding:30px 10px; color:#8A8066; font-size:14px;
  }

  footer{
    padding:22px 20px 10px; display:flex; gap:10px;
  }
  footer button{
    flex:1; padding:12px; border-radius:9px; border:1px solid var(--stone-dark);
    background:transparent; color:var(--stone-dark); font-size:13.5px; font-weight:600;
    cursor:pointer;
  }
  footer button.primary{background:var(--stone-dark); color:var(--parchment);}
  footer input[type=file]{display:none;}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--stone-ink); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:all .25s ease;
    box-shadow:0 4px 14px rgba(0,0,0,.25); max-width:88%; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (min-width:480px){
    body{max-width:480px; margin:0 auto; box-shadow:0 0 24px rgba(0,0,0,.06);}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Campanha 2026</div>
  <h1>Sacrifício</h1>
  <p>Pró-escada de entrada · R$ 50 por mês</p>
</header>

<div class="stairs" id="stairs"></div>

<div class="summary" id="summary"></div>

<section class="list-wrap">
  <div class="list-head">
    <h2>Contribuintes</h2>
    <span id="count-label">0 pessoas</span>
  </div>

  <div class="add-row">
    <input type="text" id="new-name" placeholder="Nome do contribuinte" autocomplete="off">
    <button id="add-btn">Adicionar</button>
  </div>

  <div class="col-heads">
    <span>Nome</span><span>Jun</span><span>Jul</span><span>Ago</span><span></span><span></span>
  </div>

  <ul class="contrib-list" id="list"></ul>
  <div class="empty" id="empty-msg" style="display:none;">Nenhum contribuinte ainda.<br>Adicione o primeiro nome acima.</div>
</section>

<footer>
  <button id="export-btn">⬇ Exportar backup</button>
  <button class="primary" id="import-btn">⬆ Importar backup</button>
  <input type="file" id="file-input" accept="application/json">
</footer>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "sacrificio2026";
const MONTHS = ["jun","jul","ago"];
const MONTH_LABELS = {jun:"Junho", jul:"Julho", ago:"Agosto"};
const VALOR_MES = 50;

let data = load();

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.contribuintes)) return parsed;
    }
  }catch(e){}
  return { contribuintes: [] };
}

function ensureData(){
  if(!data || typeof data !== 'object') data = { contribuintes: [] };
  if(!Array.isArray(data.contribuintes)) data.contribuintes = [];
}

function save(){
  ensureData();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    // armazenamento indisponível neste ambiente — os dados continuam
    // válidos em memória durante esta sessão, mas não persistirão.
  }
}

function uid(){
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function sortedContribuintes(){
  ensureData();
  return [...data.contribuintes].sort((a,b)=> a.nome.localeCompare(b.nome, 'pt-BR', {sensitivity:'base'}));
}

function render(){
  ensureData();
  const list = sortedContribuintes();
  const total = list.length;

  // Stairs
  const stairsEl = document.getElementById('stairs');
  stairsEl.innerHTML = '';
  MONTHS.forEach(m=>{
    const pagos = list.filter(c => c.pagos[m]).length;
    const pct = total ? Math.round((pagos/total)*100) : 0;
    const step = document.createElement('div');
    step.className = 'step' + (total && pagos===total ? ' done' : '');
    step.innerHTML = `
      <div class="label">${MONTH_LABELS[m]}</div>
      <div class="pct">${pct}%</div>
      <div class="fill" style="height:${pct}%"></div>
    `;
    stairsEl.appendChild(step);
  });

  // Summary cards
  const summaryEl = document.getElementById('summary');
  let cardsHtml = '';
  MONTHS.forEach(m=>{
    const pagos = list.filter(c => c.pagos[m]).length;
    const arrecadado = pagos * VALOR_MES;
    const meta = total * VALOR_MES;
    cardsHtml += `
      <div class="card">
        <div class="label">${MONTH_LABELS[m]}</div>
        <div class="value">R$ ${arrecadado}</div>
        <div class="label" style="margin-top:2px;">meta R$ ${meta}</div>
      </div>`;
  });
  const totalGeral = MONTHS.reduce((sum,m)=> sum + list.filter(c=>c.pagos[m]).length * VALOR_MES, 0);
  const metaGeral = total * VALOR_MES * 3;
  cardsHtml += `
    <div class="card total">
      <div class="label">Total geral (3 meses)</div>
      <div class="value">R$ ${totalGeral} <span style="font-size:14px; font-weight:500;">/ R$ ${metaGeral}</span></div>
    </div>`;
  summaryEl.innerHTML = cardsHtml;

  // List
  document.getElementById('count-label').textContent = total + (total===1 ? ' pessoa' : ' pessoas');
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty-msg');
  listEl.innerHTML = '';
  if(total===0){
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
    list.forEach(c=>{
      const li = document.createElement('li');
      const chks = MONTHS.map(m => `<div class="chk ${c.pagos[m]?'checked':''}" data-id="${c.id}" data-mes="${m}">${c.pagos[m]?'✓':''}</div>`).join('');
      li.innerHTML = `
        <div class="name" title="${escapeHtml(c.nome)}">${escapeHtml(c.nome)}</div>
        ${chks}
        <button class="edit-btn" data-id="${c.id}" aria-label="Editar nome">✎</button>
        <button class="del-btn" data-id="${c.id}" aria-label="Remover">✕</button>
      `;
      listEl.appendChild(li);
    });
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}

// Add contributor
document.getElementById('add-btn').addEventListener('click', addContribuinte);
document.getElementById('new-name').addEventListener('keydown', e=>{
  if(e.key === 'Enter') addContribuinte();
});
function addContribuinte(){
  ensureData();
  const input = document.getElementById('new-name');
  const nome = input.value.trim();
  if(!nome) return;
  data.contribuintes.push({ id: uid(), nome, pagos:{jun:false,jul:false,ago:false} });
  save();
  input.value = '';
  render();
  showToast('Contribuinte adicionado');
}

// Delegate clicks on checkboxes / delete
document.getElementById('list').addEventListener('click', e=>{
  ensureData();
  const chk = e.target.closest('.chk');
  if(chk){
    const c = data.contribuintes.find(x=>x.id===chk.dataset.id);
    if(c){
      c.pagos[chk.dataset.mes] = !c.pagos[chk.dataset.mes];
      save();
      render();
    }
    return;
  }
  const edit = e.target.closest('.edit-btn');
  if(edit){
    const c = data.contribuintes.find(x=>x.id===edit.dataset.id);
    if(c){
      const novoNome = prompt('Corrigir nome:', c.nome);
      if(novoNome !== null && novoNome.trim()){
        c.nome = novoNome.trim();
        save();
        render();
        showToast('Nome atualizado');
      }
    }
    return;
  }
  const del = e.target.closest('.del-btn');
  if(del){
    const c = data.contribuintes.find(x=>x.id===del.dataset.id);
    if(c && confirm(`Remover "${c.nome}" da lista?`)){
      data.contribuintes = data.contribuintes.filter(x=>x.id!==del.dataset.id);
      save();
      render();
      showToast('Contribuinte removido');
    }
  }
});

// Backup export
document.getElementById('export-btn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `sacrificio-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup exportado');
});

// Backup import
document.getElementById('import-btn').addEventListener('click', ()=>{
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const parsed = JSON.parse(evt.target.result);
      if(!parsed.contribuintes || !Array.isArray(parsed.contribuintes)) throw new Error('formato inválido');
      if(confirm('Importar este backup vai substituir os dados atuais. Continuar?')){
        data = parsed;
        save();
        render();
        showToast('Backup importado');
      }
    }catch(err){
      alert('Não foi possível ler este arquivo de backup.');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

// Register service worker for offline use
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    try{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }catch(e){}
  });
}

render();
</script>
</body>
</html>
